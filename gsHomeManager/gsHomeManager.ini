; ===== gsHomeManager 설정 =====
; 앱 시작 시 한 번 읽습니다. 수정 후 앱을 다시 시작하세요.
; 주석은 반드시 별도 줄에 쓰세요 (값 뒤에 붙이면 값으로 읽힙니다).
; 파일은 UTF-8 (BOM 없음) 또는 ANSI 로 저장하세요.

[Timer]
; 윈도우 위치를 랜덤으로 옮기는 시간 간격 (밀리초, 0=이동 안 함/고정, 그 외 최소 10)
MoveMs=0
; 시분초 글자가 좌우로 스크롤되는 시간 간격 (밀리초, 최소 10)
TimeScrollMs=100
; 년월일 글자가 좌우로 스크롤되는 시간 간격 (밀리초, 최소 10)
DateScrollMs=200

[Style]
; 윈도우 바탕색 (RRGGBB 16진수, 예: 000000=검정, FFFFFF=흰색)
BackColor=C0C0C0
; 1=바탕색을 모니터의 현재 바탕화면 단색에 맞춤 (바탕화면이 단색일 때만 적용), 0=BackColor 사용
BackFollowDesktop=0
; 윈도우 투명도 (10~100, 100=불투명)
Opacity=100
; 시분초 폰트 이름 (예: Consolas, 맑은 고딕)
TimeFont=HY견고딕
; 시분초 폰트 크기 (픽셀 높이, 6~400)
TimeSize=37
; 시분초 폰트 색깔 (RRGGBB 16진수)
TimeColor=0000FF
; 년월일 폰트 이름
DateFont=Segoe UI
; 년월일 폰트 크기 (픽셀 높이, 6~400)
DateSize=21
; 년월일 폰트 색깔 (RRGGBB 16진수)
DateColor=FFFF00

[Option]
; 항상 다른 앱보다 앞에 보이기 (1=On, 0=Off)
AlwaysOnTop=1
; 랜덤 이동을 모든 모니터에 적용 (1=On, 0=Off, Off 이면 기본 모니터에서만 이동)
AllMonitors=0
; 모든 가상 데스크톱에 표시 (1=On, 0=Off)
AllDesktops=1
; 시각(시분초) 표시 방식 (0=24시간제, 1=12시간제 AM/PM)
; 시분초 표시 형식 (0~9): 0=HH:mm:ss 1=hh:mm:ss tt 2=H:mm:ss 3=h:mm:ss tt 4=tt hh:mm:ss 5=오전/오후 h:mm:ss 6=HH:mm 7=HH시 mm분 ss초 8=HH.mm.ss 9=HHmmss
TimeFormat=0
; 년월일 표시 형식 (0~9): 0=yyyy-MM-dd (요일) 1=yyyy-MM-dd 2=yyyy.MM.dd 3=yyyy/MM/dd 4=yyyy년 M월 d일 (요일) 5=yy-MM-dd 6=MM/dd/yyyy 7=dd/MM/yyyy 8=yyyyMMdd 9=ddd, MMM d, yyyy
DateFormat=4
; ShowClock: 1=시계 보이기, 0=숨기기 (시스템 트레이 아이콘만 표시). 메뉴 설정 > 시계 보이기 로 바꿀 수 있고, 앱을 시작할 때는 항상 1(보이기)로 시작합니다.
ShowClock=1
; ShowDate: 1=년월일 보이기, 0=숨기기 (시분초만 표시). 메뉴 설정 > 년월일 보이기 로 바꿀 수 있습니다.
ShowDate=0
; ShowLunar: 1=년월일 다음 줄에 음력 날짜 표시 (천문연구원 공공API 조회, 인터넷 필요), 0=표시 안 함. 메뉴 설정 > 음력 보이기
ShowLunar=0
booting_alert=TRUE
tray_start=FALSE
companion_app1=C:\tools\screen_telegram\_RUN.BAT
companion_app2=
companion_app3=
companion_app4=
companion_app5=
companion_run_as_invoker=TRUE
ClockMode=0

[Lunar]
; 음력 조회용 천문연구원 공공API. 주소와 인증키가 둘 다 있어야 메뉴 '음력 보이기' 를 쓸 수 있습니다 (없으면 메뉴 비활성).
ApiUrl=https://apis.data.go.kr/B090041/openapi/service/LrsrCldInfoService/getLunCalInfo
; 공공데이터포털에서 발급받은 인증키(Decoding 키 또는 Encoding 키)를 넣으세요.
ApiKey=7f786c3c4ef34f8470d59a649ec250082c70acb9fe71878b3d86e6be0a76ca59


[Global]
; 기준 도시 이름 (본 창의 날짜 앞에 표시. 시간은 이 PC 의 시간대 기준)
BaseCity=서울
; 표시 중인 Global 도시 창 목록 (쉼표로 구분, 예: 런던,뉴욕). 도시를 추가/닫을 때와 종료할 때 자동 저장되고, 시작할 때 모두 다시 열립니다.
Cities=

[Alarm]
; 알람 1~10. 메뉴 '알람' 에서 설정하면 자동 저장됩니다. 직접 쓸 때는 N 에 1~10 을 넣으세요.
; AlarmNOn=1(사용)/0(해제), AlarmNTime=HH:MM:SS (24시간제, 이 PC 시각), AlarmNFile=재생할 동영상/음악 파일 경로
; 알람 시각이 되면 시스템 기본 플레이어로 파일을 엽니다. 사용 중인 알람은 매일 반복됩니다.
; AlarmNClose=플레이어 자동 닫기 (0=끔, 1=재생이 끝나면: 파일 길이를 못 읽으면 AlarmNCloseSec 초 후, 2=AlarmNCloseSec 초 후)
; AlarmNCloseSec=닫기까지 시간(초). 0 이면 닫지 않음
; AlarmNMemo=알람 시각에 모니터 중앙에 30초 동안 표시할 메모 (최대 100자, 파일 없이 메모만 써도 됨)
; ProgOn=1 이면 매일 ProgTime(HH:MM:SS) 에 ProgFile(BAT/CMD/EXE) 을 실행하고, ProgMemo 가 있으면 모니터 중앙에 30초 표시합니다
; RebootOn=1 이면 매일 RebootTime(HH:MM:SS) 에 재시작 확인창(300초)을 띄웁니다. Yes 또는 무응답이면 재시작 (shutdown /r /f /t 0, 앱 강제 종료), No 이면 재시작하지 않습니다

[WiFiScan]
; 앱 시작 시 자동으로 scan 을 시작합니다. WiFiScan 메뉴의 대화상자에서도 수정할 수 있습니다.
; Bluetooth scan 사용 (1=사용, 0=안 함)
ScanBluetooth=1
; Wi-Fi(LAN) scan 사용 (1=사용, 0=안 함)
ScanWifi=1
; 집 감시용 블루투스 MAC 주소 (예: AA:BB:CC:DD:EE:FF)
HomeBluetooth=F0:F5:64:13:CF:31
; 집 감시용 LAN 카드(Wi-Fi) MAC 주소
HomeMac=F0:F5:64:13:CF:32
; 집 감시용 IP 주소 (선택, 비워 두면 MAC 으로만 확인)
HomeIp=
; scan 주기 (초, 0=15초, 최소 5)
WiFiScanWatchInterval=15
; 이 시간(초) 동안 확인되지 않으면 외출로 판정 (0=60초)
NotHome=60
; --- scan 예약 (메뉴 WiFiScan > Wifi공유기 자동감시 On / Off). 아래 키가 없으면 scan 에 아무 영향이 없습니다. 매일 반복됩니다.
; ScanOnUse / ScanOffUse = 1(사용), 0(해제).  ScanOnTime / ScanOffTime = HH:MM:SS (24시간제, 이 PC 시각)
; ScanOnFile / ScanOffFile = 그 시각에 시스템 기본 플레이어로 재생할 동영상/음악 파일 경로,  ScanOnMemo / ScanOffMemo = 모니터 중앙에 30초 표시할 메모
; ScanOnClose / ScanOffClose = 플레이어 자동 닫기 (0=끔, 1=재생이 끝나면, 2=지정 시간 후),  ScanOnCloseSec / ScanOffCloseSec = 닫기까지 시간(초)
; --- HomeBack / NotHome 프로그램 (메뉴 WiFiScan > HomeBack 프로그램 / NotHome 프로그램). trigger.txt 에 /HomeBack, /NotHome 을 쓸 때마다 실행합니다.
; HomeBackProgOn / NotHomeProgOn = 1(사용), 0(해제).  HomeBackProgFile / NotHomeProgFile = 실행할 BAT/CMD/EXE 경로,  HomeBackProgMemo / NotHomeProgMemo = 모니터 중앙에 30초 표시할 메모

[IPCam]
; 폰 카메라 앱(DroidCam, IP Webcam 등)의 IP address 와 port 번호. 메뉴 'IP cam > IP cam 등록' 으로 입력합니다. (DroidCam 4747, IP Webcam 8080)
Host=192.168.0.5
Port=4747

[Window]
X=1388
Y=-6
; 윈도우 왼쪽 위 화면 좌표 X, Y (px) 는 앱이 창을 옮기거나 종료할 때 자동 저장됩니다.
; 직접 고칠 때는 앱을 끈 상태에서 수정하세요.
[PhoneFtp]
Host=192.168.0.5
Port=3150
User=pc
[Analog]
Theme=1
Neon=0
Full=0
MatchBg=0
Size=241
HideSecond=0
