; ===== launcher 설정 =====
; 주석은 반드시 별도 줄에 쓰세요 (값 뒤에 붙이면 값으로 읽힙니다).
; 파일은 UTF-8 (BOM 없음) 또는 ANSI 로 저장하세요.

[Launcher]
; 실행할 PC 의 exe (상대 경로면 gsHomeManagerLauncher.exe 가 있는 폴더 기준)
LocalExe=gsHomeManager.exe
; 서버(GitHub)의 version.txt 주소. 내용이 PC exe 의 파일 버전보다 높을 때만 exe 를 내려받습니다.
ServerVersionUrl=https://raw.githubusercontent.com/GarpsuKim/gsTop/main/gsHomeManager/version.txt
; 서버(GitHub)의 최신 exe 주소. (둘 중 하나라도 비워 두면 갱신 없이 바로 실행)
ServerExeUrl=https://raw.githubusercontent.com/GarpsuKim/gsTop/main/gsHomeManager/gsHomeManager.exe
