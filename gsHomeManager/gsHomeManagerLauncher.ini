; ===== launcher 설정 =====
; 이 파일의 이름은 런처 exe 이름과 같아야 합니다 (gsHomeManagerLauncher.exe -> gsHomeManagerLauncher.ini).
; 다른 프로젝트에서 쓸 때는 exe 와 ini 의 이름을 같이 바꿔 복사하고, LocalExe 와 서버 주소만 고치면 됩니다.
; 주석은 반드시 별도 줄에 쓰세요 (값 뒤에 붙이면 값으로 읽힙니다).
; 파일은 UTF-8 (BOM 없음) 또는 ANSI 로 저장하세요.
; 상대 경로는 런처 exe 가 있는 폴더 기준입니다. 숫자 키는 비우거나 틀리면 기본값을 씁니다.

[Launcher]
; ---- 실행 대상 ----
; 실행할 PC 의 exe (필수)
LocalExe=gsHomeManager.exe
; 본 프로세스에 넘길 명령줄 인자 (기본: 없음)
Args=
; 본 프로세스 시작 폴더 (기본: LocalExe 가 있는 폴더)
WorkDir=
; 메시지 상자 제목 (기본: 런처 exe 이름)
AppName=gsHomeManagerLauncher

; ---- 서버 갱신 ----
; 서버(GitHub)의 version.txt 주소. 내용이 PC exe 의 파일 버전보다 높을 때만 exe 를 내려받습니다.
ServerVersionUrl=https://raw.githubusercontent.com/GarpsuKim/gsTop/main/gsHomeManager/version.txt
; 서버(GitHub)의 최신 exe 주소. (둘 중 하나라도 비워 두면 갱신 없이 바로 실행)
ServerExeUrl=https://raw.githubusercontent.com/GarpsuKim/gsTop/main/gsHomeManager/gsHomeManager.exe
; 서버 연결 제한 시간 (초, 기본 5)
HttpConnectSec=5
; 서버 응답 수신 제한 시간 (초, 기본 30)
HttpReceiveSec=30

; ---- 로그 ----
; 로그 파일 (기본: 런처 exe 이름.log)
LogFile=
; 로그가 이 크기(KB)를 넘으면 새로 시작 (기본 256, 0 = 제한 없음)
LogMaxKB=256

; ---- 본 프로세스 감시 ----
; 1(기본) = 실행 후 런처가 남아서 본 프로세스를 감시하고, 종료하면 버전 확인 없이 다시 실행. 0 = 실행만 하고 런처 종료
Watch=1
; 감시할 프로세스의 exe 파일명 (기본: LocalExe 의 파일명)
ProcessName=
; 1(기본) = 정상 종료(종료 코드 0)해도 다시 실행. 0 = 정상 종료하면 감시도 끝냄
RestartOnNormalExit=1
; 비정상 종료 후 다시 실행까지 대기 (초, 기본 5)
RestartDelaySec=5
; 정상 종료 후 다시 실행까지 대기 (초, 기본 15). 다른 런처가 먼저 띄울 시간을 줍니다
NormalExitDelaySec=15
; RestartWindowSec 안에 이 횟수만큼 다시 실행했으면 감시를 포기 (기본 5, 0 = 제한 없음)
MaxRestarts=5
; 위 횟수를 세는 기간 (초, 기본 600, 0 = 기간 제한 없이 누적)
RestartWindowSec=600
; 1(기본) = 다시 실행하기 전에 같은 이름의 프로세스가 이미 떠 있으면 감시를 끝냄 (직접 실행했거나 다른 런처가 먼저 살린 경우). 0 = 확인하지 않음
SkipIfRunning=1
