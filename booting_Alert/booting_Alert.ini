; gmail_send.ini  -  gmail_send.exe 와 같은 폴더에 두세요 (UTF-8).
; 형식: 키=값   ([섹션] 은 구분용, ; 또는 # 로 시작하면 주석)
; 값이 비어 있으면 무시됩니다. 같은 이름의 환경변수가 이미 있으면 환경변수가 우선합니다.
; 비밀번호/키가 들어 있으니 다른 사람과 공유하거나 버전관리에 올리지 마세요.

[gmail]
GMAIL_USER=_____________@gmail.com
; Gmail 앱 비밀번호 (16자리, 공백 있어도 됨). 이 값이 있으면 실행 시 비밀번호 인자가 필요 없음
GMAIL_APP_PASSWORD=****************

[solapi]
SOLAPI_API_KEY=****************
SOLAPI_API_SECRET=***************************
; 등록된 발신번호 (숫자만)
SOLAPI_FROM=010********

[kakao]
KAKAO_REST_API_KEY=**********************
KAKAO_CLIENT_SECRET=*************************
; 카카오 콘솔 > 카카오 로그인 > Redirect URI 에 같은 값을 등록 (http://localhost 형식이면 자동 수신)
KAKAO_REDIRECT_URI=http://localhost:8080/callback
; 메시지 링크 도메인 (선택, 앱 플랫폼 Web 에 등록된 도메인)
;KAKAO_LINK_URL=https://example.com

[telegram]
; BotFather 에서 발급. 봇에게 메시지를 한 번 보내 두면 chat id 는 자동으로 찾아 telegram_chat.txt 에 저장
TELEGRAM_BOT_TOKEN=
; 직접 지정하려면 (선택)
;TELEGRAM_CHAT_ID=

[recipients]
; 수신자 (예전에 mail.txt 1줄에 쓰던 값). 이 섹션에 하나라도 값이 있으면
; mail.txt 는 1줄=제목, 2줄~=본문 형식이 됩니다 (수신자 줄 삭제).
; 이메일: 쉼표로 구분, @ 가 없으면 @gmail.com 이 붙음
EMAIL_TO=******@naver.com,******@kakao.com,******@gmail.com
; 문자(SMS/LMS): 전화번호, 쉼표로 여러 명 가능 (하이픈 있어도 됨)
SOLAPI_TO=010********
; 카카오톡 나에게 보내기 / 텔레그램 나에게 보내기 (TRUE 또는 FALSE)
KAKAO=TRUE
; 텔레그램은 [telegram] 의 TELEGRAM_BOT_TOKEN 을 채운 뒤 TRUE 로 바꾸세요
TELEGRAM=FALSE

[alert]
; 카카오 재인증이 필요할 때(무인 모드 KAKAO_NO_AUTH=1) SMS 알림을 받을 번호
KAKAO_ALERT_PHONE=010******
