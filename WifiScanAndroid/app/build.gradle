plugins {
    id 'com.android.application'
}

android {
    namespace 'com.garpsu.wifiscan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.garpsu.wifiscan'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 구글 통합 위치 (Fused Location): GPS + Wi-Fi + 기지국 + 센서를 합쳐 더 정확한 위치 (실내 포함)
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
