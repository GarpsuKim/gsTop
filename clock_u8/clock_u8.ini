; ===== Text Clock 설정 =====
; 앱 시작 시 한 번 읽습니다. 수정 후 앱을 다시 시작하세요.
; 주석은 반드시 별도 줄에 쓰세요 (값 뒤에 붙이면 값으로 읽힙니다).
; 파일은 UTF-8 (BOM 없음) 또는 ANSI 로 저장하세요.

[Timer]
; 윈도우 위치를 랜덤으로 옮기는 시간 간격 (밀리초, 최소 10)
MoveMs=0
; 시분초 글자가 좌우로 스크롤되는 시간 간격 (밀리초, 최소 10)
TimeScrollMs=100
; 년월일 글자가 좌우로 스크롤되는 시간 간격 (밀리초, 최소 10)
DateScrollMs=200

[Style]
; 윈도우 바탕색 (RRGGBB 16진수, 예: 000000=검정, FFFFFF=흰색)
BackColor=000000
; 윈도우 투명도 (10~100, 100=불투명)
Opacity=100
; 시분초 폰트 이름 (예: Consolas, 맑은 고딕)
TimeFont=Consolas
; 시분초 폰트 크기 (픽셀 높이, 6~400)
TimeSize=56
; 시분초 폰트 색깔 (RRGGBB 16진수)
TimeColor=00FF78
; 년월일 폰트 이름
DateFont=Segoe UI
; 년월일 폰트 크기 (픽셀 높이, 6~400)
DateSize=12
; 년월일 폰트 색깔 (RRGGBB 16진수)
DateColor=B4B4B4

[Window]
X=704
Y=396
; 윈도우 왼쪽 위 화면 좌표 X, Y (px) 는 앱이 창을 옮기거나 종료할 때 자동 저장됩니다.
; 직접 고칠 때는 앱을 끈 상태에서 수정하세요.
[Option]
AlwaysOnTop=1
AllMonitors=0
AllDesktops=1
Hour12=0
[Global]
BaseCity=서울
Cities=뉴욕
[Alarm]
Alarm1On=1
Alarm1Time=07:00:30
Alarm1File=C:\tools\clock_u8\마징가Z.mp3
Alarm1Close=0
Alarm1CloseSec=60
Alarm10On=1
Alarm10Time=23:10:00
Alarm10File=C:\tools\clock_u8\마징가Z.mp3
Alarm10Close=0
Alarm10CloseSec=60
